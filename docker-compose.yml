version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kiosk-manager-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/opt/kiosk-portal/data
      - ./config:/opt/kiosk-portal/config
      - /run/user/1001/docker.sock:/run/user/1001/docker.sock
    environment:
      - DOCKER_HOST=unix:///run/user/1001/docker.sock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kiosk-manager-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
