services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kiosk-manager-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/opt/kiosk-portal/data
      - ./config:/opt/kiosk-portal/config
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - JMS_VERIFY_SSL=${JMS_VERIFY_SSL:-true}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kiosk-manager-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - KIOSK_HOST_IP=${KIOSK_HOST_IP:-}
    volumes:
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
