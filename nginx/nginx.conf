events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # 1. HTTP Server (Port 80)
    server {
        listen 80;
        server_name _;

        # Frontend SPA files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Backend FastAPI Reverse Proxy
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # JumpServer GHSA-6rp5-ff2m-qfrm mitigation workaround
        if ($arg__rel != "") {
            return 400;
        }
    }

    # 2. HTTPS Server (Port 443 with TLS / Self-Signed SAN)
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/kiosk.crt;
        ssl_certificate_key /etc/nginx/ssl/kiosk.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Redirect plain HTTP requests sent to SSL port
        error_page 497 =301 https://$http_host$request_uri;

        # Frontend SPA files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Backend FastAPI Reverse Proxy
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # JumpServer GHSA-6rp5-ff2m-qfrm mitigation workaround
        if ($arg__rel != "") {
            return 400;
        }
    }
}
